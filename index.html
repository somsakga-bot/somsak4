<style>

h1{font:600 clamp(1.6rem,5vw,3rem) Prompt;margin:0;color:#38bdf8;text-shadow:0 1px 4px #000}.slo{color:#7dd3fc;text-shadow:0 1px 4px #000;font:600 clamp(1.1rem,3.5vw,2.2rem) Prompt}

.gal{columns:3 220px;gap:12px}.gal .card{break-inside:avoid;margin-bottom:12px;transform:rotate(-.6deg)}.gal .card:nth-child(even){transform:rotate(.7deg)}
.ph{position:relative;margin-bottom:8px}.ph img.p{margin:0;display:block}.ph .ph0{height:170px;border-radius:10px;background:#e2e8f0}.ov{color:#fff;position:absolute;left:0;right:0;bottom:0;padding:24px 8px 6px;border-radius:0 0 10px 10px;background:linear-gradient(transparent,#000c);font-size:.8rem;line-height:1.35}.box img.p{width:100%;max-height:45vh;object-fit:contain;border-radius:10px;margin-bottom:10px;background:#e2e8f0;display:block}.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.menu .tile{padding:16px 6px;font-size:.95rem}
@media(max-width:760px){.menu{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:150px;overflow-x:auto}}
.cw{width:80%;margin:0 auto}
.sum{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.sum .card{flex:0 1 240px;text-align:center}
@media print{.no{display:none!important}body{background:#fff;color:#000}.card,.box{background:#fff;border-color:#999;color:#000}header{background:#0a2a5e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}footer{-webkit-print-color-adjust:exact;print-color-adjust:exact}body.mo main,body.mo header,body.mo footer{display:none!important}.modal{position:static!important;background:none!important;padding:0!important;display:block!important;overflow:visible!important}.box{max-height:none!important;overflow:visible!important;max-width:100%!important;border:0!important}.box img.p{max-height:9cm}.ov{position:static;background:none;color:#000;padding:4px 0}.card{break-inside:avoid}img.p{max-width:100%}}
</style></head><body>
<header id="hd"><img src="logo.jpg" alt="logo"><div><h1>นพต.กองร้อยที่ 1 รุ่น 5 สระบุรี</h1><div class="slo">เหงื่อคือน้ำหอม ของลูกผู้ชาย</div></div></header>

<script>

const PV='กรุงเทพมหานคร,กระบี่,กาญจนบุรี,กาฬสินธุ์,กำแพงเพชร,ขอนแก่น,จันทบุรี,ฉะเชิงเทรา,ชลบุรี,ชัยนาท,ชัยภูมิ,ชุมพร,เชียงราย,เชียงใหม่,ตรัง,ตราด,ตาก,นครนายก,นครปฐม,นครพนม,นครราชสีมา,นครศรีธรรมราช,นครสวรรค์,นนทบุรี,นราธิวาส,น่าน,บึงกาฬ,บุรีรัมย์,ปทุมธานี,ประจวบคีรีขันธ์,ปราจีนบุรี,ปัตตานี,พระนครศรีอยุธยา,พะเยา,พังงา,พัทลุง,พิจิตร,พิษณุโลก,เพชรบุรี,เพชรบูรณ์,แพร่,ภูเก็ต,มหาสารคาม,มุกดาหาร,แม่ฮ่องสอน,ยโสธร,ยะลา,ร้อยเอ็ด,ระนอง,ระยอง,ราชบุรี,ลพบุรี,ลำปาง,ลำพูน,เลย,ศรีสะเกษ,สกลนคร,สงขลา,สตูล,สมุทรปราการ,สมุทรสงคราม,สมุทรสาคร,สระแก้ว,สระบุรี,สิงห์บุรี,สุโขทัย,สุพรรณบุรี,สุราษฎร์ธานี,สุรินทร์,หนองคาย,หนองบัวลำภู,อ่างทอง,อำนาจเจริญ,อุดรธานี,อุตรดิตถ์,อุทัยธานี,อุบลราชธานี'.split(',');
const SZ=['S','M','L','XL','2XL','3XL','4XL'],INC=['เงินสมทบจากสมาชิก','เงินบริจาค','ขายของที่ระลึก','รายได้อื่นๆ(ระบุ)'],EXP=['ทำบุญกับเพื่อนที่เสียชีวิต','ทำบุญกับญาติเพื่อนที่เสียชีวิต','ค่ากิจกรรมรุ่น','ค่าใช้จ่ายอื่นๆ(ระบุ)'],YR=[2565,2566,2567,2568,2569,2570];
// [ชื่อช่อง, ชนิด(t/a/s/n/i), ตัวเลือก, จำเป็น]
const F={

fund:[['หมวด','s',[...INC,...EXP],1],['รายละเอียด','t'],['จำนวนเงิน','n',0,1],['ผู้บันทึก','t',0,1]],
events:[['ปี','s',YR,1],['หัวข้อ','t',0,1],['รายละเอียด','a'],['ภาพ','i'],['ผู้บันทึก','t']],
news:[['หัวข้อ','t',0,1],['รายละเอียด','a',0,1],['ภาพ','i'],['ผู้บันทึก','t']],
past:[['หัวข้อ','t',0,1],['ภาพ','i',0,1],['ผู้บันทึก','t']],
stories:[['หัวข้อ','t',0,1],['รายละเอียด','a',0,1],['ภาพ','i'],['ผู้บันทึก','t']]};
const PG={fund:'กองทุนของรุ่น',events:'กิจกรรมรุ่น',news:'ข่าวประชาสัมพันธ์',past:'รวมภาพในอดีต',stories:'เรื่องเล่าสู่กันฟัง'};
let CH=[];
let PW=sessionStorage.pw||'';
function post(t,row,act,rw){return new Promise(res=>{const f=document.createElement('iframe'),fm=document.createElement('form'),i=document.createElement('input');let armed=0,done=0;f.name='fr'+Date.now();f.style.display='none';document.body.append(f);fm.method='POST';fm.action=API;fm.target=f.name;i.type='hidden';i.name='d';i.value=JSON.stringify({t,row,pw:PW,a:act,r:rw});fm.append(i);document.body.append(fm);const fin=()=>{if(done++)return;fm.remove();setTimeout(()=>{f.remove();res()},800)};f.onload=()=>{if(armed)fin()};fm.submit();setTimeout(()=>armed=1,300);setTimeout(fin,20000)})}
async function api(t,row,act,rw){if(row)return post(t,row,act,rw);const r=await fetch(API+'?t='+t+'&pw='+encodeURIComponent(PW)+(location.hash=='#manage'?'&m=1':''));const j=await r.json();if(j.error)throw j.error;return j}
function login(){PW=$('#pw').value.trim();sessionStorage.pw=PW;go()}
function gate(a){a.innerHTML=bar()+`<div class="card" style="max-width:360px;margin:auto"><h2>🔒 ใส่รหัสผ่าน</h2><label>รหัสผ่าน</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')login()"><div class="bar" style="margin-top:10px"><button onclick="login()">เข้าสู่ระบบ</button></div></div>`}
const chart=(id,type,labels,data,opt={})=>CH.push(new Chart($(id),{type,data:{labels,datasets:[{data,backgroundColor:['#0ea5e9','#2563eb','#38bdf8','#6366f1','#06b6d4','#1d4ed8','#14b8a6','#7dd3fc','#818cf8','#0369a1']}]},options:{plugins:{legend:{display:type!='bar',labels:{color:'#14532d'}}},scales:type=='bar'?{x:{ticks:{color:'#14532d'}},y:{ticks:{color:'#14532d',precision:0}}}:{},...opt}}));
const bar=(add)=>`<div class="bar no">${location.hash?'<button class="g" onclick="location.hash=\'\'">← กลับหน้าหลัก</button>':''}${add||''}<button class="g pr" onclick="print()">🖨 พิมพ์เอกสาร</button></div>`;
const pic=u=>u?`<img class="p" loading="lazy" src="${esc(u)}" alt="">`:'';
function compress(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);let q=.85,d;do{d=c.toDataURL('image/jpeg',q);q-=.1}while(d.length*.75>45e4&&q>.3);d.length*.75>3e6?no('ภาพใหญ่เกินไป'):ok(d)};i.onerror=()=>no('อ่านภาพไม่ได้');i.src=URL.createObjectURL(f)})}
function openForm(t,title,pre,r){pre=pre||{};
 const m=document.createElement('div'),sel=(o,n)=>o.map(x=>`<option${pre[n]==x?' selected':''}>${x}</option>`).join('');
 m.innerHTML=`<div class="box"><h2>${title}</h2>${F[t].map(([n,k,o,q])=>`<label>${n}${q&&!(r&&k=='i')?' *':''}</label>`+(k=='a'?`<textarea name="${n}" rows="4">${esc(pre[n])}</textarea>`:k=='s'?`<select name="${n}"><option value="">-- เลือก --</option>${t=='fund'&&n=='หมวด'?`<optgroup label="รายรับ">${sel(INC,n)}</optgroup><optgroup label="รายจ่าย">${sel(EXP,n)}</optgroup>`:sel(o,n)}</select>`:`<input name="${n}" type="${k=='i'?'file':k=='n'?'number':'text'}"${k=='i'?' accept="image/*"':` value="${esc(pre[n])}"`}${t=='fund'&&n=='ผู้บันทึก'?' list="ml" placeholder="เลขที่ / ชื่อเล่น / ชื่อ / นามสกุล ของสมาชิก"':''}>`)+(k=='i'&&r&&pre[n]?'<small>(เว้นว่าง = ใช้ภาพเดิม)</small>':'')).join('')}${t=='fund'&&!r?`<label>รหัสผ่าน *</label><input name="_pw" type="password" value="${esc(PW)}">`:''}<div class="bar" style="margin-top:14px"><button id="sv">บันทึก</button><button class="g" id="cx">ยกเลิก</button></div><small id="ms"></small><datalist id="ml"></datalist></div>`;
 m.className='modal no';document.body.append(m);if(t=='fund'&&!r)api('members').then(d=>{$('#ml').innerHTML=d.map(x=>`<option value="${esc(x['เลขที่'])}">${esc(x['ชื่อ'])} ${esc(x['นามสกุล'])}${x['ชื่อเล่น']?' ('+esc(x['ชื่อเล่น'])+')':''}</option>`).join('')}).catch(()=>{});$('#cx').onclick=()=>m.remove();
 $('#sv').onclick=async()=>{const row={},ms=$('#ms');try{
  for(const [n,k,o,q] of F[t]){const e=m.querySelector(`[name="${n}"]`);const v=k=='i'?(e.files[0]?await compress(e.files[0]):''):e.value.trim();if(k=='i'&&r&&!v)continue;if(q&&!v)throw'กรุณากรอก: '+n;row[n]=v}
  if(t=='fund'){row['ประเภท']=INC.includes(row['หมวด'])?'รายรับ':'รายจ่าย';if(/ระบุ/.test(row['หมวด'])&&!row['รายละเอียด'])throw'กรุณาระบุรายละเอียด'}
  if(t=='fund'&&!r){const pw=m.querySelector('[name="_pw"]').value.trim();if(!pw)throw'กรุณากรอก: รหัสผ่าน';const ck=await(await fetch(API+'?t=members&m=1&pw='+encodeURIComponent(pw))).json();if(ck.error)throw'รหัสผ่านไม่ถูกต้อง';PW=pw;sessionStorage.pw=pw}
  if(t=='fund'&&!r){const d=await api('members'),k=row['ผู้บันทึก'].toLowerCase(),mm=d.filter(x=>[x['เลขที่'],x['ชื่อเล่น'],x['ชื่อ'],x['นามสกุล'],x['ชื่อ']+' '+x['นามสกุล']].some(v=>String(v||'').trim().toLowerCase()==k));if(!mm.length)throw'ผู้บันทึกต้องเป็นสมาชิก กรุณากรอกเลขที่ ชื่อเล่น ชื่อ หรือนามสกุล ให้ตรงกับที่ลงทะเบียน';if(mm.length>1)throw'ตรงกับสมาชิกหลายคน กรุณากรอกเลขที่ หรือ ชื่อ นามสกุล'}

  m.remove();go()}catch(x){ms.textContent=x;$('#sv').disabled=false}}}
const addBtn=(t,l)=>`<button onclick="openForm('${t}','${l}')">＋ ${l}</button>`;
const fixTel=v=>{v=String(v||'').trim();return /^[1-9]\d{7,8}$/.test(v)?'0'+v:v},num=v=>Number(String(v).replace(/,/g,''))||0,fnum=n=>(+n).toLocaleString('th-TH');
function fundInfo(d){const sum=l=>d.filter(x=>l.includes(x['หมวด'])).reduce((s,x)=>s+num(x['จำนวนเงิน']),0),i=sum(INC),e=sum(EXP),last=d[d.length-1],man=last&&last['ประเภท']=='คงเหลือ'&&last['จำนวนเงิน']!==''?last:null;return{i,e,man,bal:man?num(man['จำนวนเงิน']):i-e}}
function fundHtml(d,full){const s=fundInfo(d),f=fnum;return `<div class="sum"><div class="card"><small>รายรับรวม</small><div class="stat in">${f(s.i)}</div></div><div class="card"><small>รายจ่ายรวม</small><div class="stat out">${f(s.e)}</div></div><div class="card"><small>เงินคงเหลือ${s.man?' (กรอกเอง)':' (คำนวณอัตโนมัติ)'}</small><div class="stat">${f(s.bal)}</div></div></div><div class="two"><div class="card"><h2>รายรับ</h2><div class="cw"><canvas id="f1"></canvas></div></div><div class="card"><h2>รายจ่าย</h2><div class="cw"><canvas id="f2"></canvas></div></div></div>`+(full?`<div class="card" style="overflow:auto"><table><tr><th>วันเวลา</th><th>หมวด</th><th>รายละเอียด</th><th>จำนวนเงิน</th><th>คงเหลือ</th></tr>${[...d].reverse().filter(x=>x['ประเภท']!='คงเหลือ').map(x=>`<tr><td>${esc(x['วันเวลา'])}</td><td>${esc(x['หมวด'])}</td><td>${esc(x['รายละเอียด'])}</td><td class="${x['ประเภท']=='รายรับ'?'in':'out'}">${f(num(x['จำนวนเงิน']))}</td><td>${x['เงินคงเหลือ']?f(num(x['เงินคงเหลือ'])):'-'}</td></tr>`).join('')}</table></div>`:'')}
function fundCharts(d){const by=L=>L.map(c=>d.filter(x=>x['หมวด']==c).reduce((s,x)=>s+num(x['จำนวนเงิน']),0));chart('#f1','pie',INC,by(INC));chart('#f2','pie',EXP,by(EXP))}
async function go(){
 CH.forEach(c=>c.destroy());CH=[];const p=location.hash.slice(1),a=$('#app');$('#hd').className=p?'':'home';
 if(p&&!PG[p]&&p!='manage'){location.hash='';return}

 try{
 if(p=='manage'&&!PW){gate(a);return}
 if(!p){let fd=[];try{fd=await api('fund')}catch(e){}const d=await api('members'),cnt=(k)=>{const o={};d.forEach(x=>{if(x[k])o[x[k]]=(o[x[k]]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  window.M=d;const pv=cnt('จังหวัด'),sz=cnt('ไซต์เสื้อ');
  a.innerHTML=bar(addBtn('members','เพิ่มข้อมูลสมาชิก')+'<button class="g" onclick="location.hash=\'manage\'">⚙ จัดการข้อมูล</button>')+`<div class="menu no">${Object.entries(PG).map(([k,v])=>`<div class="card tile" onclick="location.hash='${k}'">${v}</div>`).join('')}</div>
  <div class="two"><div class="card"><small>สมาชิกที่ลงข้อมูลแล้ว</small><div class="stat">${d.length} คน</div><div class="cw"><canvas id="c2" height="160"></canvas></div></div><div class="card"><h2>สมาชิกแยกตามจังหวัดที่ทำงาน</h2><div class="cw"><canvas id="c1"></canvas></div></div></div><h2>💰 กองทุนของรุ่น <button class="g no" onclick="location.hash='fund'">ดูรายการทั้งหมด</button></h2>${fundHtml(fd,0)}<h2>สมาชิก (คลิกดูรายละเอียด)</h2><div class="grid">${d.map((x,i)=>`<div class="card mem" onclick="det(${i})"><div class="ph">${x['ภาพหล่อๆ']?pic(x['ภาพหล่อๆ']):'<div class="ph0"></div>'}<div class="ov">${x['ชื่อเล่น']?'<b>“'+esc(x['ชื่อเล่น'])+'”</b><br>':''}🏢 ${esc(x['สถานที่ทำงาน'])}${x['เบอร์โทร']?'<br>📞 '+esc(fixTel(x['เบอร์โทร'])):''}</div></div><b>${esc(x['ชื่อ'])} ${esc(x['นามสกุล'])}</b><div class="m">เลขที่ ${esc(x['เลขที่'])} · ${esc(x['จังหวัด'])}</div></div>`).join('')}</div>`;
  chart('#c1','bar',pv.map(x=>x[0]),pv.map(x=>x[1]));chart('#c2','doughnut',sz.map(x=>'ไซต์ '+x[0]),sz.map(x=>x[1]));fundCharts(fd)}
 else if(p=='fund'){const d=await api('fund'),s=fundInfo(d);a.innerHTML=bar(addBtn('fund','บันทึกรายรับ/รายจ่าย')+'<button class="g" onclick="manual()">ตั้งยอดคงเหลือเอง</button>'+(s.man?'<button class="g" onclick="manual(1)">ใช้ค่าคำนวณอัตโนมัติ</button>':''))+'<h2>กองทุนของรุ่น</h2>'+fundHtml(d,1);fundCharts(d)}
 else if(p=='manage'){await manage(a)}
 else{const d=(await api(p)).reverse();let y=window.Y||YR[YR.length-1];
  const feed=()=>{const L=p=='events'?d.filter(x=>x['ปี']==y):d;return (p=='events'?`<div class="tabs no">${YR.map(v=>`<button class="${v==y?'on':''}" onclick="Y=${v};go()">งานเลี้ยงรุ่น ${v}</button>`).join('')}</div><h2>ปี ${y}</h2>`:'')+(L.length?`<div class="${p=='past'?'gal':'grid'}" ${p=='news'||p=='stories'?'style="grid-template-columns:1fr"':''}>${L.map(x=>`<div class="card">${pic(x['ภาพ'])}<b>${esc(x['หัวข้อ'])}</b><div style="white-space:pre-wrap;margin:6px 0">${esc(x['รายละเอียด'])}</div><small>${esc(x['วันเวลา'])}${x['ผู้บันทึก']?' · โดย '+esc(x['ผู้บันทึก']):''}</small></div>`).join('')}</div>`:'<p class="m">ยังไม่มีข้อมูล</p>')};
  a.innerHTML=bar(addBtn(p,'เพิ่ม'+PG[p]))+`<h2>${PG[p]}</h2>`+feed()}
 }catch(x){if(x=='pw'){PW='';delete sessionStorage.pw;alert('รหัสผ่านไม่ถูกต้อง');go();return}a.innerHTML=bar()+`<p class="out">โหลดข้อมูลไม่สำเร็จ: ${esc(x)}<br>ตรวจสอบ URL ของ Web App ในไฟล์ index.html</p>`}}
function closeM(m){m.remove();document.body.classList.remove('mo')}
function det(i){const x=M[i],m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target==m)closeM(m)};
 m.innerHTML=`<div class="box">${pic(x['ภาพหล่อๆ'])}<h2>${esc(x['ชื่อ'])} ${esc(x['นามสกุล'])}</h2>${Object.entries(x).filter(([k])=>k!='_row'&&k!='ภาพหล่อๆ'&&k!='ชื่อ'&&k!='นามสกุล').map(([k,v])=>`<p><span class="m">${esc(k)}:</span> ${esc(k=='เบอร์โทร'?fixTel(v):v)}</p>`).join('')}<div class="bar no"><button onclick="print()">🖨 พิมพ์</button><button class="g" onclick="closeM(this.closest('.modal'))">ปิด</button></div></div>`;document.body.append(m);document.body.classList.add('mo')}
async function manual(c){if(!PW){const q=prompt('ใส่รหัสผ่านเพื่อตั้งยอดคงเหลือ');if(!q)return;PW=q;sessionStorage.pw=q}let v='';if(!c){v=prompt('ใส่ยอดเงินคงเหลือ (ค่านี้ใช้จนกว่าจะมีรายการรับ/จ่ายใหม่)');if(v===null)return}await api('fund',{'ประเภท':'คงเหลือ','หมวด':'ตั้งยอด','จำนวนเงิน':v.trim(),'ผู้บันทึก':''});go()}
async function manage(a){const t=window.MT||'members',d=await api(t);window.MD=d;const ks=d.length?Object.keys(d[0]).filter(k=>k!='_row'):F[t].map(x=>x[0]);
 a.innerHTML=bar('<a class="btn" target="_blank" href="https://docs.google.com/spreadsheets/d/1Y4ETvVvG90XxS6Im0N3LNu08hdmLXTsIjDGC1skArMI/edit">เปิด Google Sheet</a>')+`<h2>⚙ จัดการข้อมูล</h2><div class="tabs no">${[['members','สมาชิก'],...Object.entries(PG)].map(([k,v])=>`<button class="${k==t?'on':''}" onclick="MT='${k}';go()">${v}</button>`).join('')}</div><div class="card" style="overflow:auto">${d.length?`<table><tr>${ks.map(k=>`<th>${esc(k)}</th>`).join('')}<th class="no">จัดการ</th></tr>${d.map((x,i)=>`<tr>${ks.map(k=>`<td>${k.indexOf('ภาพ')==0&&x[k]?`<img src="${esc(x[k])}" style="height:40px;border-radius:6px">`:esc(x[k])}</td>`).join('')}<td class="no" style="white-space:nowrap">${x['ประเภท']=='คงเหลือ'?'':`<button onclick="ed(${i})">แก้ไข</button> `}<button class="g" onclick="rm(${i})">ลบ</button></td></tr>`).join('')}</table>`:'<p class="m">ยังไม่มีข้อมูล</p>'}</div>`}
function ed(i){const t=window.MT||'members';openForm(t,'แก้ไขข้อมูล',{...MD[i],'เบอร์โทร':fixTel(MD[i]['เบอร์โทร'])},MD[i]._row)}
async function rm(i){if(!confirm('ลบรายการนี้ออกจาก Google Sheet ใช่หรือไม่?'))return;await api(window.MT||'members',{},'del',MD[i]._row);go()}
addEventListener('hashchange',go);go();
</script></body></html>
